name: Backend AI Runtime Config

on:
  workflow_dispatch:
    inputs:
      mock_ai:
        description: "Keep MOCK_AI enabled. false switches the backend to the real dual-provider runtime."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      deepseek_api_key_parameter:
        description: "SSM parameter name that stores the DeepSeek API key"
        required: true
        default: /tripsync/backend/prod/deepseek-api-key
      deepseek_base_url:
        description: "DeepSeek base URL used by backend agents"
        required: true
        default: https://api.deepseek.com
      deepseek_model:
        description: "DeepSeek model used by planner and explainer by default"
        required: true
        default: deepseek-v4-flash
      ollama_cloud_api_key_parameter:
        description: "SSM parameter name that stores the Ollama Cloud API key"
        required: true
        default: /tripsync/backend/prod/ollama-cloud-api-key
      geoapify_api_key_parameter:
        description: "SSM parameter name that stores the Geoapify API key"
        required: true
        default: /tripsync/backend/prod/geoapify-api-key
      ollama_cloud_base_url:
        description: "Ollama Cloud base URL used by backend agents"
        required: true
        default: https://ollama.com/v1/
      ollama_cloud_model:
        description: "Ollama Cloud model used by chat by default"
        required: true
        default: qwen3.5:cloud
      chat_ai_provider:
        description: "Provider routed to chat agent"
        required: true
        default: ollama_cloud
      planner_ai_provider:
        description: "Provider routed to planner agent"
        required: true
        default: deepseek
      explainer_ai_provider:
        description: "Provider routed to explainer agent"
        required: true
        default: deepseek
      ai_fallback_provider:
        description: "Optional fallback provider. Leave blank to disable fallback."
        required: false
        default: ""

permissions:
  contents: read

env:
  ECS_CLUSTER: tripsync-cluster
  ECS_SERVICE: tripsync-backend-service
  TASK_FAMILY: tripsync-backend
  CONTAINER_NAME: tripsync-backend
  LOG_GROUP_NAME: /ecs/tripsync-backend
  ALB_NAME: tripsync-backend-alb

jobs:
  update-ai-runtime:
    name: Update Backend AI Runtime
    runs-on: ubuntu-latest
    environment: Main

    steps:
      - name: Enforce main branch for cloud operations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::This workflow may only run from the main branch. Re-run it from main."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Discover current backend task definition
        id: discover
        shell: bash
        env:
          INPUT_MOCK_AI: ${{ inputs.mock_ai }}
          INPUT_DEEPSEEK_API_KEY_PARAMETER: ${{ inputs.deepseek_api_key_parameter }}
          INPUT_OLLAMA_CLOUD_API_KEY_PARAMETER: ${{ inputs.ollama_cloud_api_key_parameter }}
          INPUT_GEOAPIFY_API_KEY_PARAMETER: ${{ inputs.geoapify_api_key_parameter }}
        run: |
          set -euo pipefail

          CURRENT_TASK_DEF_ARN="$(aws ecs describe-services \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query 'services[0].taskDefinition' \
            --output text)"

          CURRENT_TASK_DEF="$(aws ecs describe-task-definition \
            --task-definition "${CURRENT_TASK_DEF_ARN}" \
            --output json)"

          EXECUTION_ROLE_ARN="$(jq -r '.taskDefinition.executionRoleArn' <<< "${CURRENT_TASK_DEF}")"
          TASK_ROLE_ARN="$(jq -r '.taskDefinition.taskRoleArn' <<< "${CURRENT_TASK_DEF}")"
          CPU="$(jq -r '.taskDefinition.cpu' <<< "${CURRENT_TASK_DEF}")"
          MEMORY="$(jq -r '.taskDefinition.memory' <<< "${CURRENT_TASK_DEF}")"
          BACKEND_CONTAINER="$(jq -c ".taskDefinition.containerDefinitions[] | select(.name == \"${CONTAINER_NAME}\")" <<< "${CURRENT_TASK_DEF}")"

          if [ -z "${BACKEND_CONTAINER}" ] || [ "${BACKEND_CONTAINER}" = "null" ]; then
            echo "::error::Backend container ${CONTAINER_NAME} was not found on the current task definition."
            exit 1
          fi

          DATABASE_URL_SECRET="$(jq -r '.secrets[]? | select(.name == "DATABASE_URL") | .valueFrom' <<< "${BACKEND_CONTAINER}")"
          if [ -z "${DATABASE_URL_SECRET}" ] || [ "${DATABASE_URL_SECRET}" = "null" ]; then
            echo "::error::DATABASE_URL secret is not present on the current backend task definition."
            exit 1
          fi

          DEEPSEEK_API_KEY_SECRET_ARN=""
          OLLAMA_CLOUD_API_KEY_SECRET_ARN=""
          GEOAPIFY_API_KEY_SECRET_ARN=""
          if [ "${INPUT_MOCK_AI}" = "false" ]; then
            DEEPSEEK_API_KEY_SECRET_ARN="$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=Equals,Values=${INPUT_DEEPSEEK_API_KEY_PARAMETER}" \
              --query 'Parameters[0].ARN' \
              --output text)"

            if [ -z "${DEEPSEEK_API_KEY_SECRET_ARN}" ] || [ "${DEEPSEEK_API_KEY_SECRET_ARN}" = "None" ]; then
              echo "::error::SSM parameter ${INPUT_DEEPSEEK_API_KEY_PARAMETER} was not found."
              exit 1
            fi

            OLLAMA_CLOUD_API_KEY_SECRET_ARN="$(aws ssm describe-parameters \
              --parameter-filters "Key=Name,Option=Equals,Values=${INPUT_OLLAMA_CLOUD_API_KEY_PARAMETER}" \
              --query 'Parameters[0].ARN' \
              --output text)"

            if [ -z "${OLLAMA_CLOUD_API_KEY_SECRET_ARN}" ] || [ "${OLLAMA_CLOUD_API_KEY_SECRET_ARN}" = "None" ]; then
              echo "::error::SSM parameter ${INPUT_OLLAMA_CLOUD_API_KEY_PARAMETER} was not found."
              exit 1
            fi
          fi

          GEOAPIFY_API_KEY_SECRET_ARN="$(aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=${INPUT_GEOAPIFY_API_KEY_PARAMETER}" \
            --query 'Parameters[0].ARN' \
            --output text)"

          if [ -z "${GEOAPIFY_API_KEY_SECRET_ARN}" ] || [ "${GEOAPIFY_API_KEY_SECRET_ARN}" = "None" ]; then
            echo "::error::SSM parameter ${INPUT_GEOAPIFY_API_KEY_PARAMETER} was not found."
            exit 1
          fi

          APP_ENV="$(jq -r '.environment[]? | select(.name == "APP_ENV") | .value' <<< "${BACKEND_CONTAINER}")"
          DISABLE_SCHEDULER="$(jq -r '.environment[]? | select(.name == "DISABLE_SCHEDULER") | .value' <<< "${BACKEND_CONTAINER}")"
          FRONTEND_BASE_URL="$(jq -r '.environment[]? | select(.name == "FRONTEND_BASE_URL") | .value' <<< "${BACKEND_CONTAINER}")"
          CORS_ORIGINS="$(jq -r '.environment[]? | select(.name == "CORS_ORIGINS") | .value' <<< "${BACKEND_CONTAINER}")"
          SETTLE_TICK_SECONDS="$(jq -r '.environment[]? | select(.name == "SETTLE_TICK_SECONDS") | .value' <<< "${BACKEND_CONTAINER}")"

          APP_ENV="${APP_ENV:-production}"
          DISABLE_SCHEDULER="${DISABLE_SCHEDULER:-1}"
          DEV_ALLOW_MEMBERSHIP_HEADER="0"
          FRONTEND_BASE_URL="${FRONTEND_BASE_URL:-http://localhost:3000}"
          CORS_ORIGINS="${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}"
          SETTLE_TICK_SECONDS="${SETTLE_TICK_SECONDS:-60}"

          {
            echo "current_task_def_arn=${CURRENT_TASK_DEF_ARN}"
            echo "execution_role_arn=${EXECUTION_ROLE_ARN}"
            echo "task_role_arn=${TASK_ROLE_ARN}"
            echo "cpu=${CPU}"
            echo "memory=${MEMORY}"
            echo "database_url_secret=${DATABASE_URL_SECRET}"
            echo "deepseek_api_key_secret_arn=${DEEPSEEK_API_KEY_SECRET_ARN}"
            echo "ollama_cloud_api_key_secret_arn=${OLLAMA_CLOUD_API_KEY_SECRET_ARN}"
            echo "geoapify_api_key_secret_arn=${GEOAPIFY_API_KEY_SECRET_ARN}"
            echo "app_env=${APP_ENV}"
            echo "disable_scheduler=${DISABLE_SCHEDULER}"
            echo "dev_allow_membership_header=${DEV_ALLOW_MEMBERSHIP_HEADER}"
            echo "frontend_base_url=${FRONTEND_BASE_URL}"
            echo "cors_origins=${CORS_ORIGINS}"
            echo "settle_tick_seconds=${SETTLE_TICK_SECONDS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Register task definition with AI runtime config
        id: taskdef
        shell: bash
        env:
          INPUT_MOCK_AI: ${{ inputs.mock_ai }}
          INPUT_DEEPSEEK_BASE_URL: ${{ inputs.deepseek_base_url }}
          INPUT_DEEPSEEK_MODEL: ${{ inputs.deepseek_model }}
          INPUT_OLLAMA_CLOUD_BASE_URL: ${{ inputs.ollama_cloud_base_url }}
          INPUT_OLLAMA_CLOUD_MODEL: ${{ inputs.ollama_cloud_model }}
          INPUT_CHAT_AI_PROVIDER: ${{ inputs.chat_ai_provider }}
          INPUT_PLANNER_AI_PROVIDER: ${{ inputs.planner_ai_provider }}
          INPUT_EXPLAINER_AI_PROVIDER: ${{ inputs.explainer_ai_provider }}
          INPUT_AI_FALLBACK_PROVIDER: ${{ inputs.ai_fallback_provider }}
        run: |
          set -euo pipefail

          CURRENT_TASK_DEF="$(aws ecs describe-task-definition \
            --task-definition "${{ steps.discover.outputs.current_task_def_arn }}" \
            --output json)"
          BACKEND_CONTAINER="$(jq -c ".taskDefinition.containerDefinitions[] | select(.name == \"${CONTAINER_NAME}\")" <<< "${CURRENT_TASK_DEF}")"
          if [ -z "${BACKEND_CONTAINER}" ] || [ "${BACKEND_CONTAINER}" = "null" ]; then
            echo "::error::Backend container ${CONTAINER_NAME} was not found while building the updated task definition."
            exit 1
          fi

          if [ "${INPUT_MOCK_AI}" = "true" ]; then
            MOCK_AI_VALUE="1"
          else
            MOCK_AI_VALUE="0"
          fi

          UPDATED_CONTAINER="$(
            jq -c \
              --argjson container "${BACKEND_CONTAINER}" \
              --arg app_env "${{ steps.discover.outputs.app_env }}" \
              --arg disable_scheduler "${{ steps.discover.outputs.disable_scheduler }}" \
              --arg mock_ai "${MOCK_AI_VALUE}" \
              --arg dev_allow_membership_header "${{ steps.discover.outputs.dev_allow_membership_header }}" \
              --arg frontend_base_url "${{ steps.discover.outputs.frontend_base_url }}" \
              --arg cors_origins "${{ steps.discover.outputs.cors_origins }}" \
              --arg settle_tick_seconds "${{ steps.discover.outputs.settle_tick_seconds }}" \
              --arg deepseek_base_url "${INPUT_DEEPSEEK_BASE_URL}" \
              --arg deepseek_model "${INPUT_DEEPSEEK_MODEL}" \
              --arg ollama_cloud_base_url "${INPUT_OLLAMA_CLOUD_BASE_URL}" \
              --arg ollama_cloud_model "${INPUT_OLLAMA_CLOUD_MODEL}" \
              --arg chat_ai_provider "${INPUT_CHAT_AI_PROVIDER}" \
              --arg planner_ai_provider "${INPUT_PLANNER_AI_PROVIDER}" \
              --arg explainer_ai_provider "${INPUT_EXPLAINER_AI_PROVIDER}" \
              --arg ai_fallback_provider "${INPUT_AI_FALLBACK_PROVIDER}" \
              --arg database_url_secret "${{ steps.discover.outputs.database_url_secret }}" \
              --arg deepseek_api_key_secret_arn "${{ steps.discover.outputs.deepseek_api_key_secret_arn }}" \
              --arg ollama_cloud_api_key_secret_arn "${{ steps.discover.outputs.ollama_cloud_api_key_secret_arn }}" \
              --arg geoapify_api_key_secret_arn "${{ steps.discover.outputs.geoapify_api_key_secret_arn }}" \
              '
              def upsert_env($name; $value):
                .environment = ((.environment // []) | map(select(.name != $name)) + [{name: $name, value: $value}]);
              def remove_env($name):
                .environment = ((.environment // []) | map(select(.name != $name)));
              def upsert_secret($name; $valueFrom):
                .secrets = ((.secrets // []) | map(select(.name != $name)) + [{name: $name, valueFrom: $valueFrom}]);
              def remove_secret($name):
                .secrets = ((.secrets // []) | map(select(.name != $name)));
              $container
              | del(.healthCheck)
              | upsert_env("APP_ENV"; $app_env)
              | upsert_env("DISABLE_SCHEDULER"; $disable_scheduler)
              | upsert_env("MOCK_AI"; $mock_ai)
              | upsert_env("DEV_ALLOW_MEMBERSHIP_HEADER"; $dev_allow_membership_header)
              | upsert_env("FRONTEND_BASE_URL"; $frontend_base_url)
              | upsert_env("CORS_ORIGINS"; $cors_origins)
              | upsert_env("SETTLE_TICK_SECONDS"; $settle_tick_seconds)
              | upsert_env("DEEPSEEK_BASE_URL"; $deepseek_base_url)
              | upsert_env("DEEPSEEK_MODEL"; $deepseek_model)
              | upsert_env("OLLAMA_CLOUD_BASE_URL"; $ollama_cloud_base_url)
              | upsert_env("OLLAMA_CLOUD_MODEL"; $ollama_cloud_model)
              | upsert_env("CHAT_AI_PROVIDER"; $chat_ai_provider)
              | upsert_env("PLANNER_AI_PROVIDER"; $planner_ai_provider)
              | upsert_env("EXPLAINER_AI_PROVIDER"; $explainer_ai_provider)
              | if ($ai_fallback_provider | length) > 0
                then upsert_env("AI_FALLBACK_PROVIDER"; $ai_fallback_provider)
                else remove_env("AI_FALLBACK_PROVIDER")
                end
              | remove_env("AI_DEFAULT_PROVIDER")
              | remove_env("OPENAI_BASE_URL")
              | remove_env("OPENAI_MODEL")
              | upsert_secret("DATABASE_URL"; $database_url_secret)
              | if ($deepseek_api_key_secret_arn | length) > 0
                then upsert_secret("DEEPSEEK_API_KEY"; $deepseek_api_key_secret_arn)
                else remove_secret("DEEPSEEK_API_KEY")
                end
              | if ($ollama_cloud_api_key_secret_arn | length) > 0
                then upsert_secret("OLLAMA_CLOUD_API_KEY"; $ollama_cloud_api_key_secret_arn)
                else remove_secret("OLLAMA_CLOUD_API_KEY")
                end
              | if ($geoapify_api_key_secret_arn | length) > 0
                then upsert_secret("GEOAPIFY_API_KEY"; $geoapify_api_key_secret_arn)
                else remove_secret("GEOAPIFY_API_KEY")
                end
              | remove_secret("OPENAI_API_KEY")
              ' <<< '{}'
          )"

          jq -n \
            --arg family "${TASK_FAMILY}" \
            --arg network_mode "awsvpc" \
            --arg execution_role_arn "${{ steps.discover.outputs.execution_role_arn }}" \
            --arg task_role_arn "${{ steps.discover.outputs.task_role_arn }}" \
            --arg cpu "${{ steps.discover.outputs.cpu }}" \
            --arg memory "${{ steps.discover.outputs.memory }}" \
            --argjson container "${UPDATED_CONTAINER}" \
            '{
              family: $family,
              networkMode: $network_mode,
              requiresCompatibilities: ["FARGATE"],
              cpu: $cpu,
              memory: $memory,
              executionRoleArn: $execution_role_arn,
              taskRoleArn: $task_role_arn,
              containerDefinitions: [$container]
            }' > /tmp/task-definition-backend-ai-runtime.json

          TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/task-definition-backend-ai-runtime.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "task_definition_arn=${TASK_DEFINITION_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Update ECS service
        shell: bash
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${{ steps.taskdef.outputs.task_definition_arn }}" \
            --desired-count 1 \
            --deployment-configuration "minimumHealthyPercent=100,maximumPercent=200,deploymentCircuitBreaker={enable=true,rollback=true}" \
            --health-check-grace-period-seconds 60 >/dev/null

          if ! aws ecs wait services-stable --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}"; then
            echo "::group::ECS service events"
            aws ecs describe-services \
              --cluster "${ECS_CLUSTER}" \
              --services "${ECS_SERVICE}" \
              --query 'services[0].events[0:10].[createdAt,message]' \
              --output table || true
            echo "::endgroup::"

            echo "::group::Recent stopped tasks"
            STOPPED_TASKS="$(aws ecs list-tasks \
              --cluster "${ECS_CLUSTER}" \
              --service-name "${ECS_SERVICE}" \
              --desired-status STOPPED \
              --max-results 5 \
              --query 'taskArns' \
              --output text || true)"
            if [ -n "${STOPPED_TASKS}" ]; then
              aws ecs describe-tasks \
                --cluster "${ECS_CLUSTER}" \
                --tasks ${STOPPED_TASKS} \
                --query 'tasks[].{stoppedReason:stoppedReason,lastStatus:lastStatus,taskArn:taskArn,containers:containers[].{name:name,exitCode:exitCode,reason:reason,lastStatus:lastStatus}}' \
                --output json || true
            else
              echo "No stopped tasks found."
            fi
            echo "::endgroup::"

            echo "::group::Recent backend log streams"
            LATEST_STREAMS="$(aws logs describe-log-streams \
              --log-group-name "${LOG_GROUP_NAME}" \
              --order-by LastEventTime \
              --descending \
              --max-items 3 \
              --query 'logStreams[].logStreamName' \
              --output text || true)"
            if [ -n "${LATEST_STREAMS}" ]; then
              for stream in ${LATEST_STREAMS}; do
                echo "--- ${stream} ---"
                aws logs get-log-events \
                  --log-group-name "${LOG_GROUP_NAME}" \
                  --log-stream-name "${stream}" \
                  --limit 20 \
                  --query 'events[].message' \
                  --output text || true
              done
            else
              echo "No backend log streams found."
            fi
            echo "::endgroup::"

            exit 1
          fi

      - name: Verify backend health
        shell: bash
        run: |
          set -euo pipefail

          ALB_DNS="$(aws elbv2 describe-load-balancers --names "${ALB_NAME}" --query 'LoadBalancers[0].DNSName' --output text)"
          curl --fail --silent --show-error "http://${ALB_DNS}/api/health"
          echo
          echo "Backend health check passed after AI runtime config update."
