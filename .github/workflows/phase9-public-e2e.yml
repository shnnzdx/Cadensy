name: Operations — Public Production E2E

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: "Public TripSync frontend URL to test"
        required: true
        default: "https://app.cadensy.top"

permissions:
  contents: read

jobs:
  public-e2e:
    name: Browser E2E Against Public URL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run public browser E2E
        working-directory: frontend
        env:
          TRIPSYNC_PUBLIC_URL: ${{ inputs.public_url }}
          TRIPSYNC_E2E_ARTIFACT_DIR: test-results/aws-public-e2e
        run: npm run e2e:aws

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-public-e2e-screenshots
          path: frontend/test-results/aws-public-e2e
          if-no-files-found: ignore
