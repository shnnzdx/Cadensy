name: CI Regression Gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-regression-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu latest can advance before a particular patch build is published for
  # that runner image. Keep the approved Python 3.13 line while allowing
  # setup-python to select an available security-patched release.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22.13.0"

jobs:
  classify-change-scope:
    name: CI — Classify Documentation or Code Change
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      docs_changed: ${{ steps.scope.outputs.docs_changed }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
      head_sha: ${{ steps.scope.outputs.head_sha }}
    steps:
      - name: Check out change history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          head_sha="${GITHUB_SHA}"
          base_sha=""
          case "${EVENT_NAME}" in
            pull_request)
              base_sha="${PR_BASE_SHA}"
              head_sha="${PR_HEAD_SHA}"
              ;;
            push)
              base_sha="${EVENT_BEFORE}"
              ;;
            workflow_dispatch)
              # A manual run is an explicit request for the full regression suite.
              echo "code_changed=true" >> "${GITHUB_OUTPUT}"
              echo "docs_changed=false" >> "${GITHUB_OUTPUT}"
              echo "docs_only=false" >> "${GITHUB_OUTPUT}"
              echo "base_sha=" >> "${GITHUB_OUTPUT}"
              echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            *)
              echo "Unexpected event '${EVENT_NAME}'; failing safe to code validation." >&2
              echo "code_changed=true" >> "${GITHUB_OUTPUT}"
              echo "docs_changed=false" >> "${GITHUB_OUTPUT}"
              echo "docs_only=false" >> "${GITHUB_OUTPUT}"
              echo "base_sha=" >> "${GITHUB_OUTPUT}"
              echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
          esac

          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]] || \
             ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null || \
             ! git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
            echo "Cannot establish a trusted diff; running the full code suite." >&2
            echo "code_changed=true" >> "${GITHUB_OUTPUT}"
            echo "docs_changed=false" >> "${GITHUB_OUTPUT}"
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            echo "base_sha=" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          code_changed=false
          docs_changed=false
          mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "Empty diff; running the full code suite." >&2
            code_changed=true
          fi

          for file in "${changed_files[@]}"; do
            case "${file}" in
              *.md|application_docs/**|AI_enhanced/**|AWS/**)
                docs_changed=true
                ;;
              *)
                code_changed=true
                ;;
            esac
          done

          docs_only=false
          if [[ "${docs_changed}" = true && "${code_changed}" = false ]]; then
            docs_only=true
          fi

          echo "code_changed=${code_changed}" >> "${GITHUB_OUTPUT}"
          echo "docs_changed=${docs_changed}" >> "${GITHUB_OUTPUT}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

  documentation-ci:
    name: Documentation — Relative Link Check
    needs: classify-change-scope
    if: ${{ always() && needs.classify-change-scope.outputs.docs_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.classify-change-scope.outputs.head_sha }}
          fetch-depth: 0

      - name: Validate changed Markdown relative links
        shell: bash
        env:
          BASE_SHA: ${{ needs.classify-change-scope.outputs.base_sha }}
          HEAD_SHA: ${{ needs.classify-change-scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 - "${BASE_SHA}" "${HEAD_SHA}" <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote

          base_sha, head_sha = sys.argv[1:]
          root = Path.cwd().resolve()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", base_sha, head_sha], text=True
          ).splitlines()
          markdown_files = [root / path for path in changed if path.lower().endswith(".md")]
          pattern = re.compile(r"(?<!!)\[[^\]]*\]\(([^)\n]+)\)")
          failures: list[str] = []

          for source in markdown_files:
              if not source.is_file():
                  continue
              for target in pattern.findall(source.read_text(encoding="utf-8")):
                  target = target.strip()
                  if target.startswith("<") and ">" in target:
                      target = target[1 : target.index(">")]
                  else:
                      target = target.split(maxsplit=1)[0]
                  if not target or target.startswith(("#", "/", "mailto:", "tel:")) or "://" in target:
                      continue
                  target_path = unquote(target.split("#", 1)[0])
                  if not target_path:
                      continue
                  resolved = (source.parent / target_path).resolve()
                  try:
                      resolved.relative_to(root)
                  except ValueError:
                      failures.append(f"{source.relative_to(root)}: link escapes repository: {target}")
                  else:
                      if not resolved.exists():
                          failures.append(f"{source.relative_to(root)}: missing target: {target}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)
          print(f"Validated relative links in {len(markdown_files)} changed Markdown file(s).")
          PY

  backend-legacy-full-regression:
    name: Backend — Legacy Full Regression
    needs: classify-change-scope
    # If scope classification cannot run, the empty output is not "false" and
    # this required check runs rather than silently allowing a code change.
    if: ${{ always() && needs.classify-change-scope.outputs.code_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runtime-looking URL is deliberately different from the disposable
      # database. pytest replaces DATABASE_URL with TEST_DATABASE_URL internally.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cadensy_ci_legacy_runtime
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cadensy_ci_legacy_test
      DISABLE_SCHEDULER: "1"
      MOCK_AI: "1"
      GEOAPIFY_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      DEV_ALLOW_MEMBERSHIP_HEADER: "0"
      CADENSY_EVAL_DEPENDENCY_LOCK: requirements-legacy-regression.lock.txt
      LEGACY_JUNIT_XML: test-results/legacy-junit.xml
      EVALUATION_OUTPUT: evals/reports/ci/legacy-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cadensy_ci_legacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cadensy_ci_legacy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-legacy-regression.lock.txt

      - name: Install frozen Legacy regression dependencies
        working-directory: backend
        run: |
          python -m pip install --requirement requirements-legacy-regression.lock.txt
          python -m pip check

      - name: Verify disposable database boundary
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          test_url = make_url(os.environ["TEST_DATABASE_URL"])
          runtime_url = make_url(os.environ["DATABASE_URL"])
          assert test_url.get_backend_name() == "postgresql"
          assert test_url.host in {"localhost", "127.0.0.1", "::1"}
          assert test_url.database == "cadensy_ci_legacy_test"
          assert runtime_url.database != test_url.database
          assert os.environ["MOCK_AI"] == "1"
          assert os.environ["DEEPSEEK_API_KEY"] == ""
          assert os.environ["GEOAPIFY_API_KEY"] == ""
          assert os.environ["DEV_ALLOW_MEMBERSHIP_HEADER"] == "0"
          PY

      - name: Run Legacy full regression
        # The isolated Pydantic PoC belongs exclusively to its own job.  This
        # job must have no collected skips; the next step enforces that JUnit
        # contract rather than treating a missing dependency as a pass.
        working-directory: backend
        run: |
          mkdir -p "$(dirname "$LEGACY_JUNIT_XML")"
          python -m pytest -q \
            --ignore=tests/test_pydantic_ai_poc.py \
            --ignore=tests/test_pydantic_runtime.py \
            --ignore=tests/test_pydantic_composition.py \
            --ignore=tests/test_pydantic_durable_runtime_acceptance.py \
            --ignore=tests/test_pydantic_concurrency_fencing_acceptance.py \
            --ignore=tests/test_symmetric_evaluation_harness.py \
            --ignore=tests/test_formal_ab_runner.py \
            --ignore=tests/test_provider_smoke_harness.py \
            --ignore=tests/test_live_provider_smoke_adapter.py \
            --junitxml="$LEGACY_JUNIT_XML"

      - name: Validate Legacy JUnit skip contract
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit_path = Path(os.environ["LEGACY_JUNIT_XML"])
          assert junit_path.is_file(), f"Missing JUnit report: {junit_path}"
          root = ET.parse(junit_path).getroot()
          assert root.findall(".//testcase"), "JUnit report contains no collected tests"
          skipped = root.findall(".//skipped")
          assert not skipped, f"Legacy job has unapproved skipped tests: {len(skipped)}"
          PY

      - name: Generate frozen Golden Dataset report
        working-directory: backend
        run: python -m evals.runner --output "$EVALUATION_OUTPUT"

      - name: Validate evaluation report is traceable and privacy-safe
        id: validate_evaluation_artifact
        working-directory: backend
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          output = Path(os.environ["EVALUATION_OUTPUT"])
          manifest_path = output / "manifest.json"
          summary_path = output / "summary.json"
          cases_path = output / "cases.jsonl"
          for path in (manifest_path, summary_path, cases_path):
              assert path.is_file(), f"Missing evaluation artifact: {path}"

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          approved_dataset_hash = "e2f631dbc2b26ef06f2d51a226ee1c780f50743b32cd3806ac4bfae85dc1c32f"
          computed_dataset_hash = hashlib.sha256(
              Path("evals/datasets/chat_change_preview_v1.json")
              .read_bytes()
              .replace(b"\r\n", b"\n")
          ).hexdigest()
          assert computed_dataset_hash == approved_dataset_hash
          assert computed_dataset_hash == manifest["dataset_hash"]
          assert manifest["dataset_hash"] == approved_dataset_hash
          assert manifest["dataset_version"] == "chat-change-preview-v1"
          required_manifest_keys = {
              "dataset_hash",
              "runtime",
              "dependency_configuration",
              "grader_version",
              "git_commit",
          }
          assert required_manifest_keys <= manifest.keys()
          assert manifest["dependency_configuration"] == {
              "lockfile": "requirements-legacy-regression.lock.txt",
              "lockfile_sha256": hashlib.sha256(
                  Path("requirements-legacy-regression.lock.txt").read_bytes()
              ).hexdigest(),
              "python_version": sys.version.split()[0],
          }
          assert manifest["database_isolation"] == {
              "source": "TEST_DATABASE_URL",
              "backend": "postgresql",
              "host": "localhost",
              "database": "cadensy_ci_legacy_test",
              "runtime_database_url_used": False,
          }
          assert manifest["fixture_visibility"] == {
              "worker_session_is_independent": True,
              "tool_invocations": [
                  "get_current_plan",
                  "get_trip_facts",
                  "classify_change",
              ],
              "destination": "Synthetic City",
              "member_count": 2,
              "plan_item_titles": ["Art Institute of Chicago", "Birthday dinner"],
              "classification_path": "notice",
          }
          assert manifest["runtime"]["provider_mode"] == "fake"
          assert summary == {
              "total_cases": 8,
              "passed_cases": 6,
              "failed_cases": 2,
              "safety_violations": 0,
          }
          expected_case_outcomes = {
              "explicit-time-notice": True,
              "ambiguous-time": False,
              "ambiguous-item": True,
              "booked-item-confirm": True,
              "provider-failure-fallback": True,
              "tool-failure-fallback": True,
              "privacy-injection": False,
              "cross-trip-denied": True,
          }
          case_results = {}
          for line in cases_path.read_text(encoding="utf-8").splitlines():
              record = json.loads(line)
              case_id = record["case_id"]
              assert case_id not in case_results, f"Duplicate evaluation case: {case_id}"
              case_results[case_id] = record
          assert set(case_results) == set(expected_case_outcomes)
          for case_id, expected_passed in expected_case_outcomes.items():
              assert case_results[case_id]["passed"] is expected_passed

          # PR-04D-Prep approved these two behavior-derived Legacy mismatches.
          # The gate must reject a different six-of-eight outcome.
          ambiguous_time = case_results["ambiguous-time"]
          assert ambiguous_time["observed"]["output_kind"] == "safe_degraded"
          assert ambiguous_time["observed"]["failure_taxonomy"] == "unexpected_exception"
          privacy_injection = case_results["privacy-injection"]
          assert privacy_injection["observed"]["output_kind"] == "clarification"
          artifact_text = "\n".join(
              path.read_text(encoding="utf-8")
              for path in (manifest_path, summary_path, cases_path)
          ).casefold()
          for forbidden in (
              "sensitive fixture phrase",
              "original_text",
              "deepseek_api_key",
              "authorization: bearer",
          ):
              assert forbidden not in artifact_text, f"Sensitive artifact marker: {forbidden}"
          PY

      - name: Upload Legacy evaluation artifacts
        if: ${{ steps.validate_evaluation_artifact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: legacy-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/${{ env.EVALUATION_OUTPUT }}
          if-no-files-found: error
          retention-days: 14

  pydantic-ai-isolated-fake-compatibility:
    name: Pydantic AI — Isolated Fake Compatibility
    needs: classify-change-scope
    if: ${{ always() && needs.classify-change-scope.outputs.code_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cadensy_ci_pydantic_runtime
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cadensy_ci_pydantic_test
      DISABLE_SCHEDULER: "1"
      MOCK_AI: "1"
      GEOAPIFY_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      DEV_ALLOW_MEMBERSHIP_HEADER: "0"
      CADENSY_EVAL_DEPENDENCY_LOCK: requirements-pydantic-ai-poc.lock.txt

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cadensy_ci_pydantic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cadensy_ci_pydantic_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-pydantic-ai-poc.lock.txt

      - name: Install isolated Pydantic AI PoC dependencies
        working-directory: backend
        run: |
          python -m pip install --requirement requirements-pydantic-ai-poc.lock.txt
          python -m pip check
          python -c "import pydantic_ai; print('pydantic_ai_available')"

      - name: Verify disposable database boundary
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          test_url = make_url(os.environ["TEST_DATABASE_URL"])
          runtime_url = make_url(os.environ["DATABASE_URL"])
          assert test_url.get_backend_name() == "postgresql"
          assert test_url.host in {"localhost", "127.0.0.1", "::1"}
          assert test_url.database == "cadensy_ci_pydantic_test"
          assert runtime_url.database != test_url.database
          assert os.environ["MOCK_AI"] == "1"
          assert os.environ["DEEPSEEK_API_KEY"] == ""
          assert os.environ["GEOAPIFY_API_KEY"] == ""
          assert os.environ["DEV_ALLOW_MEMBERSHIP_HEADER"] == "0"
          PY

      - name: Run isolated Fake compatibility contracts
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_pydantic_ai_poc.py
          tests/test_pydantic_composition.py
          tests/test_pydantic_runtime.py
          tests/test_pydantic_durable_runtime_acceptance.py
          tests/test_pydantic_concurrency_fencing_acceptance.py
          tests/test_symmetric_evaluation_harness.py
          tests/test_formal_ab_runner.py
          tests/test_runtime_composition.py
          tests/test_provider_smoke_harness.py
          tests/test_live_provider_smoke_adapter.py
          tests/test_evaluation_foundation.py

  backend-production-pydantic-image-proof:
    name: Backend — Production Pydantic Image Proof
    needs: classify-change-scope
    if: ${{ always() && needs.classify-change-scope.outputs.code_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production backend image
        run: docker build --tag cadensy-backend-pr04e-proof backend

      - name: Verify production Pydantic imports without network access
        run: >-
          docker run --rm --network none cadensy-backend-pr04e-proof
          sh -c 'python -m pip check && python -c "import pydantic_ai" && python -c "import app.agents.pydantic_composition" && python -c "import app.domain.chat.service"'

  backend-migration-runner-image-proof:
    name: Backend — Migration Runner Image Proof
    needs: classify-change-scope
    if: ${{ always() && needs.classify-change-scope.outputs.code_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build one-off Alembic runner image
        run: >-
          docker build
          --file backend/Dockerfile.r5-migration-runner
          --tag cadensy-backend-migration-runner-proof
          backend

      - name: Verify runner contains the complete offline migration contract
        run: >-
          docker run --rm --network none cadensy-backend-migration-runner-proof
          sh -c 'python -m pip check && test -f alembic.ini && test -f alembic/versions/f9ff23b7b84d_baseline_existing_schema.py && test -f alembic/versions/c2a4b6d8e0f1_pr05b_phase1_trip_ledger_schema.py && python -m alembic -c alembic.ini heads && python -c "import app.db.legacy_schema_compat"'

  frontend-regression:
    name: Frontend — Regression and Builds
    needs: classify-change-scope
    if: ${{ always() && needs.classify-change-scope.outputs.code_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            trip/package-lock.json

      - name: Install Trip workspace dependencies
        working-directory: trip
        run: npm ci

      - name: Build Trip workspace
        working-directory: trip
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and sync the embedded Trip preview
        working-directory: frontend
        run: npm run build:trip-preview

      - name: Run frontend regression and production build
        # frontend's existing npm test script runs its production build before
        # the Node regression tests; this keeps that package contract intact.
        working-directory: frontend
        run: npm test
