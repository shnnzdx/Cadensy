name: Frontend Hosting Proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-hosting-proof:
    name: Frontend Hosting Proof
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            trip/package-lock.json

      - name: Install Trip dependencies
        working-directory: trip
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and sync Trip preview
        working-directory: frontend
        run: npm run build:trip-preview

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Inspect hosting output shape
        working-directory: frontend
        run: npm run hosting:proof
