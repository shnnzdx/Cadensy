name: Runtime Secrets Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-hygiene:
    name: Secret Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no local environment files are tracked
        shell: bash
        run: |
          set -euo pipefail

          tracked_env_files="$(git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -vE '(^|/)\.env(\..*)?\.example$' || true)"

          if [ -n "${tracked_env_files}" ]; then
            echo "::error::Tracked local environment file(s) found. Remove these files from git:"
            printf '%s\n' "${tracked_env_files}"
            exit 1
          fi

          echo "No tracked local .env files found."

      - name: Scan for high-confidence secret patterns
        shell: bash
        run: |
          set -euo pipefail

          patterns=(
            'AKIA[0-9A-Z]{16}'
            'ASIA[0-9A-Z]{16}'
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
            'sk-[A-Za-z0-9_-]{20,}'
            'ghp_[A-Za-z0-9_]{20,}'
            'github_pat_[A-Za-z0-9_]{20,}'
          )

          matched=0

          for pattern in "${patterns[@]}"; do
            if git grep -I -n -E -e "${pattern}" -- . \
              ':(exclude)AWS/PHASE6_RUNTIME_SECRETS_PLAN.md' \
              ':(exclude).github/workflows/runtime-secrets-readiness.yml'; then
              matched=1
            fi
          done

          if [ "${matched}" -ne 0 ]; then
            echo "::error::High-confidence secret pattern found in tracked files."
            exit 1
          fi

          echo "No high-confidence secret patterns found."

      - name: Confirm Phase 6 first-proof runtime is documented
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'DISABLE_SCHEDULER=1' AWS/PHASE6_RUNTIME_SECRETS_PLAN.md
          grep -q 'MOCK_AI=1' AWS/PHASE6_RUNTIME_SECRETS_PLAN.md
          grep -q 'Do not run:' AWS/PHASE6_RUNTIME_SECRETS_PLAN.md
          grep -q 'aws secretsmanager get-secret-value' AWS/PHASE6_RUNTIME_SECRETS_PLAN.md

          echo "Phase 6 runtime secret rules are documented."
