name: Database Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-readiness:
    name: Database Readiness
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripsync_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripsync_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Initialize schema without seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tripsync_ci
          DISABLE_SCHEDULER: "1"
          MOCK_AI: "1"
        run: python -m app.db.init_schema

      - name: Verify destructive seed guard
        working-directory: backend
        env:
          DISABLE_SCHEDULER: "1"
          MOCK_AI: "1"
        run: python -m pytest -q tests/test_db_safety.py

      - name: Run full backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tripsync_ci
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tripsync_ci
          DISABLE_SCHEDULER: "1"
          MOCK_AI: "1"
        run: python -m pytest -q
