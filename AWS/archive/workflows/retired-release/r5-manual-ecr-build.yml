name: R5 — Manual ECR Build & Push

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r5-manual-ecr-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APPROVED_AWS_ACCOUNT_ID: "448678332746"
  APPROVED_AWS_REGION: us-east-1
  ECR_REPOSITORY: tripsync-backend
  RELEASE_SHA: 6daf90ed4f1130171ff6e84c11241f374dc5aeeb

jobs:
  build-and-push:
    name: Build immutable R5 images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Main
    timeout-minutes: 30

    steps:
      - name: Check out build tooling from the dispatched main revision
        uses: actions/checkout@v4
        with:
          path: tooling
          fetch-depth: 1

      - name: Enforce main-only dispatch and record tooling identity
        id: tooling
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          tooling_sha="$(git -C tooling rev-parse HEAD)"
          test "${tooling_sha}" = "${GITHUB_SHA}"
          echo "sha=${tooling_sha}" >> "${GITHUB_OUTPUT}"

      - name: Check out the approved immutable application release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 1

      - name: Verify release source and assemble isolated build context
        shell: bash
        run: |
          set -euo pipefail
          actual_release_sha="$(git -C release rev-parse HEAD)"
          test "${actual_release_sha}" = "${RELEASE_SHA}"
          test -f release/backend/Dockerfile
          test -f release/backend/alembic.ini
          test -f release/backend/alembic/versions/c2a4b6d8e0f1_pr05b_phase1_trip_ledger_schema.py
          test -f tooling/backend/Dockerfile.r5-migration-runner
          cp tooling/backend/Dockerfile.r5-migration-runner release/backend/Dockerfile.r5-migration-runner

      - name: Configure AWS credentials from the Main environment
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.APPROVED_AWS_REGION }}

      - name: Verify approved AWS account, region, and existing ECR repository
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test "${AWS_REGION}" = "${APPROVED_AWS_REGION}"
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${account_id}" = "${APPROVED_AWS_ACCOUNT_ID}"
          repository_uri="$(aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          test "${repository_uri}" = "${account_id}.dkr.ecr.${APPROVED_AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "repository_uri=${repository_uri}" >> "${GITHUB_OUTPUT}"

      - name: Derive immutable image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          echo "runtime=${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "migration=${RELEASE_SHA}-migration-${{ steps.tooling.outputs.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Refuse to overwrite an existing release tag
        env:
          RUNTIME_TAG: ${{ steps.tags.outputs.runtime }}
          MIGRATION_TAG: ${{ steps.tags.outputs.migration }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "${RUNTIME_TAG}" "${MIGRATION_TAG}"; do
            error_file="$(mktemp)"
            if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${tag}" >/dev/null 2>"${error_file}"; then
              echo "::error::Refusing to overwrite existing immutable ECR tag ${tag}."
              exit 1
            fi
            if ! grep -q 'ImageNotFoundException' "${error_file}"; then
              echo "::error::Unable to prove that ECR tag ${tag} is unused."
              cat "${error_file}"
              exit 1
            fi
          done

      - name: Authenticate Docker to the existing ECR repository
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "${APPROVED_AWS_REGION}" | \
            docker login --username AWS --password-stdin \
              "${APPROVED_AWS_ACCOUNT_ID}.dkr.ecr.${APPROVED_AWS_REGION}.amazonaws.com"

      - name: Build immutable runtime and migration-runner images
        env:
          ECR_URI: ${{ steps.target.outputs.repository_uri }}
          RUNTIME_TAG: ${{ steps.tags.outputs.runtime }}
          MIGRATION_TAG: ${{ steps.tags.outputs.migration }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --file release/backend/Dockerfile \
            --tag "${ECR_URI}:${RUNTIME_TAG}" release/backend
          docker build --file release/backend/Dockerfile.r5-migration-runner \
            --tag "${ECR_URI}:${MIGRATION_TAG}" release/backend

      - name: Verify the migration runner offline without database access
        env:
          ECR_URI: ${{ steps.target.outputs.repository_uri }}
          MIGRATION_TAG: ${{ steps.tags.outputs.migration }}
        shell: bash
        run: |
          set -euo pipefail
          migration_image="${ECR_URI}:${MIGRATION_TAG}"
          docker run --rm --network none "${migration_image}" sh -eu -c '
            test ! -f /app/.env
            python -m pip check
            test -f alembic.ini
            test -f alembic/versions/f9ff23b7b84d_baseline_existing_schema.py
            test -f alembic/versions/c2a4b6d8e0f1_pr05b_phase1_trip_ledger_schema.py
            test "$(python -m alembic -c alembic.ini heads | awk "{print \$1}")" = "c2a4b6d8e0f1"
            python -c "import app.db.legacy_schema_compat"
          '
          if docker image inspect "${migration_image}" --format '{{.Config.Env}}' | \
            grep -Eqi 'database_url=|aws_secret_access_key=|deepseek_api_key='; then
            echo "::error::Migration runner image contains a prohibited runtime secret setting."
            exit 1
          fi

      - name: Push immutable images to ECR
        env:
          ECR_URI: ${{ steps.target.outputs.repository_uri }}
          RUNTIME_TAG: ${{ steps.tags.outputs.runtime }}
          MIGRATION_TAG: ${{ steps.tags.outputs.migration }}
        shell: bash
        run: |
          set -euo pipefail
          for tag in "${RUNTIME_TAG}" "${MIGRATION_TAG}"; do
            error_file="$(mktemp)"
            if aws ecr describe-images \
              --repository-name "${ECR_REPOSITORY}" \
              --image-ids "imageTag=${tag}" >/dev/null 2>"${error_file}"; then
              echo "::error::Refusing to overwrite existing immutable ECR tag ${tag}."
              exit 1
            fi
            if ! grep -q 'ImageNotFoundException' "${error_file}"; then
              echo "::error::Unable to prove that ECR tag ${tag} is unused immediately before push."
              cat "${error_file}"
              exit 1
            fi
          done
          docker push "${ECR_URI}:${RUNTIME_TAG}"
          docker push "${ECR_URI}:${MIGRATION_TAG}"

      - name: Record immutable ECR artifact metadata
        env:
          ECR_URI: ${{ steps.target.outputs.repository_uri }}
          RUNTIME_TAG: ${{ steps.tags.outputs.runtime }}
          MIGRATION_TAG: ${{ steps.tags.outputs.migration }}
          TOOLING_SHA: ${{ steps.tooling.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids "imageTag=${RUNTIME_TAG}" --query 'imageDetails[0].imageDigest' --output text)"
          migration_digest="$(aws ecr describe-images --repository-name "${ECR_REPOSITORY}" --image-ids "imageTag=${MIGRATION_TAG}" --query 'imageDetails[0].imageDigest' --output text)"
          {
            echo '## R5 immutable ECR build result'
            echo
            echo "- GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Application source SHA: ${RELEASE_SHA}"
            echo "- Migration tooling SHA: ${TOOLING_SHA}"
            echo "- Runtime: ${ECR_URI}:${RUNTIME_TAG} (${runtime_digest})"
            echo "- Migration runner: ${ECR_URI}:${MIGRATION_TAG} (${migration_digest})"
            echo '- Result: both immutable artifacts were built and pushed; no deployment action was requested by this workflow.'
          } >> "${GITHUB_STEP_SUMMARY}"
